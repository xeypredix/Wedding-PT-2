<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Invitation</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Playfair+Display:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><div id="decor" aria-hidden="true"></div>
<main class="wrap">
<section class="card reveal">
<h1>Wedding <span>CEREMONY</span></h1>
<p class="names"><span data-w="bride"></span> &amp; <span data-w="groom"></span></p>
<p class="date" data-w="date"></p><p class="time" data-w="time"></p>
<div class="divider" aria-hidden="true">✿</div>
<h2>Venue</h2><p class="venue-name" data-w="venue"></p><p class="addr" data-w="address"></p>
<div class="divider" aria-hidden="true">✿</div>
<a class="btn" href="countdown.html">COUNTDOWN TO OUR DAY</a>
</section>
<section class="card album" aria-labelledby="mem">
<h2 id="mem">Our Memories</h2>
<div class="couple"><img src="images/couple.webp" alt="Our couple portrait" width="963" height="1157" fetchpriority="high" decoding="async"></div>
<div class="grid">
<figure class="frame"><img src="images/photo1.webp" alt="Wedding photo 1" width="736" height="523" loading="lazy" decoding="async"></figure>
<figure class="frame"><img src="images/photo2.webp" alt="Wedding photo 2" width="1080" height="1452" loading="lazy" decoding="async"></figure>
<figure class="frame"><img src="images/photo3.webp" alt="Wedding photo 3" width="1224" height="1224" loading="lazy" decoding="async"></figure>
<figure class="frame"><img src="images/photo4.webp" alt="Wedding photo 4" width="780" height="1040" loading="lazy" decoding="async"></figure>
<figure class="frame"><img src="images/photo5.webp" alt="Wedding photo 5" width="577" height="657" loading="lazy" decoding="async"></figure>

</div></section></main>
<div id="floral" class="floral" aria-hidden="true"></div>
<script src="countdown.js"></script></body></html>
