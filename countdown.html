<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown to Our Special Day</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Playfair+Display:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><div id="decor" aria-hidden="true"></div>
<main class="wrap">
<a class="back" href="index.html">← Back to Invitation</a>
<section class="card reveal">
<h1><span>Countdown to</span>Our Special Day</h1>
<p class="names"><span data-w="bride"></span> &amp; <span data-w="groom"></span></p>
<p class="date" data-w="date"></p>
<div class="divider" aria-hidden="true">✿</div>
<div class="timer" id="timer" role="timer" aria-live="off">
<div class="unit"><b id="days">0</b><small>DAYS</small></div>
<div class="unit"><b id="hours">00</b><small>HOURS</small></div>
<div class="unit"><b id="minutes">00</b><small>MINUTES</small></div>
<div class="unit"><b id="seconds">00</b><small>SECONDS</small></div>
</div></section></main>
<div id="floral" class="floral" aria-hidden="true"></div>
<script src="countdown.js"></script></body></html>
